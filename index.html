<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Raízes de Minas</title>
<meta name="description" content="Direto da roça para sua casa — faça seu pedido pelo WhatsApp.">
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Fraunces:ital,wght@0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <img src="assets/logo.jpg" alt="Raízes de Minas" class="logo">
      <div class="topbar-text">
        <h1>Raízes de Minas</h1>
        <p class="tagline">Direto da roça para sua casa</p>
      </div>
    </div>
  </header>

  <main class="catalog" id="catalog">
    <!-- Os produtos são inseridos aqui automaticamente pelo app.js -->
  </main>

  <div id="empty-state" class="empty-state" hidden>
    <p>Nenhum produto cadastrado ainda.</p>
    <p class="empty-sub">Edite o arquivo <code>produtos.js</code> para adicionar itens ao catálogo.</p>
  </div>

  <!-- Barra flutuante do carrinho -->
  <button id="cart-bar" class="cart-bar" hidden>
    <span class="cart-bar-count" id="cart-count">0 itens</span>
    <span class="cart-bar-action">Ver pedido</span>
    <span class="cart-bar-total" id="cart-total">R$ 0,00</span>
  </button>

  <!-- Painel de revisão do pedido -->
  <div id="review-overlay" class="review-overlay" hidden>
    <div class="review-sheet">
      <div class="review-header">
        <h2>Revisar pedido</h2>
        <button id="review-close" class="icon-btn" aria-label="Fechar">✕</button>
      </div>

      <div class="review-items" id="review-items">
        <!-- Itens do pedido -->
      </div>

      <div class="review-field">
        <label for="customer-name">Seu nome</label>
        <input type="text" id="customer-name" placeholder="Como podemos te chamar?">
      </div>

      <div class="review-field">
        <label for="customer-note">Observações (opcional)</label>
        <textarea id="customer-note" placeholder="Ex: sem açúcar, entregar à tarde..." rows="2"></textarea>
      </div>

      <div class="review-total-row">
        <span>Total</span>
        <span id="review-total">R$ 0,00</span>
      </div>

      <button id="send-whatsapp" class="send-btn">
        <svg viewBox="0 0 24 24" class="wa-icon" aria-hidden="true"><path d="M17.6 6.3A8.4 8.4 0 0 0 5 16.9L4 21l4.2-1.1a8.4 8.4 0 0 0 12-7.5 8.4 8.4 0 0 0-2.6-6.1Zm-5.6 13a7 7 0 0 1-3.6-1l-.3-.1-2.6.7.7-2.5-.2-.3a7 7 0 1 1 6 3.2Zm3.8-5.2c-.2-.1-1.2-.6-1.4-.7-.2-.1-.3-.1-.5.1s-.6.7-.7.9-.3.2-.5.1a5.8 5.8 0 0 1-1.7-1 6.4 6.4 0 0 1-1.2-1.5c-.1-.2 0-.3.1-.4l.3-.4.2-.3a.4.4 0 0 0 0-.4c-.1-.1-.5-1.2-.7-1.6-.2-.4-.4-.4-.5-.4h-.4a.9.9 0 0 0-.6.3 2.6 2.6 0 0 0-.8 1.9 4.5 4.5 0 0 0 1 2.4 10.3 10.3 0 0 0 4 3.5c.5.2 1 .4 1.3.5a3 3 0 0 0 1.4.1c.4-.1 1.2-.5 1.4-1s.2-.9.1-1c0-.1-.2-.2-.4-.3Z"/></svg>
        Enviar pedido pelo WhatsApp
      </button>
    </div>
  </div>

  <script src="produtos.js"></script>
  <script src="app.js"></script>
</body>
</html>
